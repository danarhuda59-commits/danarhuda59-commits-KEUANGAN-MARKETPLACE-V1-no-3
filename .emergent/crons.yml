crons:
  - name: stock-daily-summary
    description: "Menyimpan ringkasan harian stok bahan & produk di bawah minimum setiap pagi 07:00 WIB"
    cron: "0 7 * * *"
    timezone: "Asia/Jakarta"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/cron/stock-daily"
    method: POST
    enabled: true
